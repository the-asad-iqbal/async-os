# AsyncOS build workflow

name: OS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (comma separated IDs, empty for all)'
        required: false
        type: string
  workflow_call:
    inputs:
      boards:
        description: 'Boards to build (comma separated IDs, empty for all)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version_full: ${{ steps.version.outputs.version_full }}
      build_container_image: ghcr.io/${{ github.repository_owner }}/asyncos-builder@${{ steps.build_asyncos_builder.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set development version suffix
        if: ${{ github.event_name != 'release' }}
        run: |
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1dev$(date --utc +%Y%m%d%H%M)\2/" buildroot-external/meta

      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          . buildroot-external/meta
          version_full="${VERSION_MAJOR}.${VERSION_MINOR}${VERSION_SUFFIX:+.${VERSION_SUFFIX}}"
          if [ "${{ github.event_name }}" == "release" ] && [ "${version_full}" != "${RELEASE_TAG}" ]; then
            echo "::error::Version in buildroot-external/meta (${version_full}) does not match the release tag (${RELEASE_TAG})."
            exit 1
          fi
          echo "version_full=${version_full}" >> "$GITHUB_OUTPUT"

      - name: Create build matrix
        id: matrix
        env:
          BOARDS: ${{ inputs.boards }}
        run: |
          matrix="$(jq -c --arg boards "${BOARDS}" '
            ($boards | split(",") | map(select(. != ""))) as $filter
            | {board: (if ($filter | length) == 0 then . else map(select(.id | IN($filter[]))) end)}
          ' .github/workflows/matrix.json)"
          if [ "$(jq '.board | length' <<< "${matrix}")" -eq 0 ]; then
            echo "::error::No known board in '${BOARDS}'."
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build_asyncos_builder
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/asyncos-builder
          cache-from: ghcr.io/${{ github.repository_owner }}/asyncos-builder:cache
          cache-to: ghcr.io/${{ github.repository_owner }}/asyncos-builder:cache
          push: true

  build:
    name: Build for ${{ matrix.board.id }}
    needs: prepare
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: ${{ github.event_name == 'release' }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set version
        env:
          VERSION_FULL: ${{ needs.prepare.outputs.version_full }}
        run: |
          . buildroot-external/meta
          suffix="${VERSION_FULL#"${VERSION_MAJOR}.${VERSION_MINOR}"}"
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${suffix#.}\2/" buildroot-external/meta

      - name: Add release signing key
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: |
          if [ -z "${RAUC_CERTIFICATE}" ] || [ -z "${RAUC_PRIVATE_KEY}" ]; then
            echo "::warning::RAUC_CERTIFICATE or RAUC_PRIVATE_KEY secret is missing, signing with a self-signed development certificate."
            exit 0
          fi
          printf -- '-----BEGIN CERTIFICATE-----\n%s\n-----END CERTIFICATE-----\n' "${RAUC_CERTIFICATE}" > cert.pem
          printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "${RAUC_PRIVATE_KEY}" > key.pem

      - name: Free space on build drive
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/cache /mnt/output
          owner="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo ln -sf /mnt/output "${GITHUB_WORKSPACE}/output"
          sudo chown -R "${owner}" /mnt/cache /mnt/output
          df -h

      - name: "Restore cache: object files"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: asyncos-cc-${{ matrix.board.id }}
          restore-keys: asyncos-cc-${{ matrix.board.id }}-

      - name: Generate build config
        uses: "./.github/actions/asyncos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: make ${{ matrix.board.defconfig }}_defconfig

      - name: Build
        uses: "./.github/actions/asyncos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: make

      - name: Check Linux config
        uses: "./.github/actions/asyncos-builder-command"
        with:
          image: ${{ needs.prepare.outputs.build_container_image }}
          command: |
            make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" linux-check-dotconfig

      - name: Compute image digests
        working-directory: output/images/
        env:
          SUMS: asyncos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}.sha256
        run: |
          sha256sum asyncos_* > "${RUNNER_TEMP}/sums"
          mv "${RUNNER_TEMP}/sums" "${SUMS}"

      - name: Upload images
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asyncos_${{ matrix.board.id }}-${{ needs.prepare.outputs.version_full }}
          path: output/images/asyncos_*
          compression-level: 0
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: shogo82148/actions-upload-release-asset@9ee13965a8a51926f330b424693f25fcff8f2ef6 # v1.10.6
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: output/images/asyncos_*

      - name: "Save cache: object files"
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/cache/cc
          key: asyncos-cc-${{ matrix.board.id }}-${{ github.run_id }}

      - name: Build summary
        run: |
          {
            echo "# ${{ matrix.board.id }}"
            echo "| File | Size |"
            echo "|:-|-:|"
            for f in output/images/asyncos_*; do
              echo "| $(basename "$f") | $(du -bh "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
