name-template: AsyncOS $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION
version-template: "$MAJOR.$MINOR"
categories:
  - title: 'AsyncOS'
    label: 'os'
  - title: 'Controller'
    label: 'controller'
  - title: 'Open Virtual Appliance'
    label: 'board/ova'
  - title: 'Generic x86-64'
    label: 'board/generic-x86-64'
  - title: 'Generic aarch64'
    label: 'board/generic-aarch64'
  - title: 'Documentation'
    label: 'documentation'
  - title: 'Build System'
    label: 'build'
  - title: 'Dependencies'
    label: 'dependencies'
filter-by-commitish: true
template: |
  ## Changes

  $CHANGES
version-resolver:
  major:
    labels:
      - 'major'
  default: minor
