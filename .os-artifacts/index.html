<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AsyncOS - development builds</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20width%3D%2236%22%20height%3D%2236%22%20aria-hidden%3D%22true%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22asyncos-bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%2264%22%20y2%3D%2264%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236B6CF8%22/%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233F3BD9%22/%3E%20%3C/linearGradient%3E%20%3C/defs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23asyncos-bg%29%22/%3E%20%3Cpath%20d%3D%22M18%2047%20L29.5%2017%20M34.5%2017%20L46%2047%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22/%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2237%22%20r%3D%223.75%22%20fill%3D%22%2322D3EE%22/%3E%20%3C/svg%3E">
        <style>
            :root {
                --primary: #5B5CF6;
                --accent: #22D3EE;
                --ink: #0B1020;
                --muted: #64748B;
                --surface: #F5F7FB;
                --border: #E2E8F0;
                --background: #FFFFFF;
                --danger: #EF4444;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --primary: #7E7FF9;
                    --ink: #F5F7FB;
                    --muted: #94A3B8;
                    --surface: #131A2E;
                    --border: #1E2740;
                    --background: #0B1020;
                }
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                padding: 48px 16px;
                background: var(--background);
                color: var(--ink);
                font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
                line-height: 1.5;
            }
            main { max-width: 720px; margin: 0 auto; }
            header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
            h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
            h1 span { color: var(--primary); }
            header p { margin: 0; color: var(--muted); font-size: 14px; }
            select {
                font: inherit;
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--surface);
                color: var(--ink);
            }
            select:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
            ul { list-style: none; padding: 0; margin: 24px 0 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
            li + li { border-top: 1px solid var(--border); }
            li a {
                display: block;
                padding: 12px 16px;
                color: var(--ink);
                text-decoration: none;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 14px;
                overflow-wrap: anywhere;
            }
            li a:hover { background: var(--surface); color: var(--primary); }
            .error { color: var(--danger); }
        </style>
    </head>
    <body>
        <main>
            <header>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
                  <defs>
                    <linearGradient id="asyncos-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                      <stop offset="0" stop-color="#6B6CF8"/>
                      <stop offset="1" stop-color="#3F3BD9"/>
                    </linearGradient>
                  </defs>
                  <rect width="64" height="64" rx="16" fill="url(#asyncos-bg)"/>
                  <path d="M18 47 L29.5 17 M34.5 17 L46 47" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
                  <circle cx="32" cy="37" r="3.75" fill="#22D3EE"/>
                </svg>
                <div>
                    <h1>Async<span>OS</span></h1>
                    <p>Development builds</p>
                </div>
            </header>
            <select id="os-builds" aria-label="Build version"></select>
            <div id="os-builds-list"></div>
        </main>
        <script>
            const buildSelect = document.getElementById('os-builds');
            const osBuildsList = document.getElementById('os-builds-list');

            const fillVersions = async () => {
                try {
                    const response = await fetch('/index.json');
                    if (!response.ok) {
                        const p = document.createElement('p');
                        p.className = "error";
                        p.textContent = "Could not load version index file.";
                        osBuildsList.appendChild(p);
                        return;
                    }
                    const items = await response.json();
                    items.reverse();

                    items.forEach(buildVersion => {
                        buildSelect.appendChild(new Option(buildVersion, buildVersion));
                    });

                    buildSelect.dispatchEvent(new Event('change'));
                } catch (error) {
                    console.error('Error fetching data:', error);
                }
            }

            buildSelect.addEventListener('change', async function() {
                osBuildsList.innerHTML = '';

                const buildVersion = this.value;

                try {
                    const response = await fetch(`/indexes/${buildVersion}.json`);
                    if (!response.ok) {
                        const p = document.createElement('p');
                        p.className = "error";
                        p.textContent = `Could not load index file for version ${buildVersion}.`;
                        osBuildsList.appendChild(p);
                        return;
                    }
                    const images = await response.json();

                    const ul = document.createElement('ul');
                    images.forEach(image => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href =`/${buildVersion}/${image}`;
                        a.textContent = image;
                        li.appendChild(a);
                        ul.appendChild(li);
                    });

                    osBuildsList.appendChild(ul);
                } catch (error) {
                    console.error('Error fetching images:', error);
                }
            });

            fillVersions();
        </script>
    </body>
</html>
